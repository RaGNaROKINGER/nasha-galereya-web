<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наша Галерея</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg1:#14271C; --bg2:#0A140E; --fg:#F6EFDF; --fg-dim:#C4B796; --gold:#D4AF62;
  --gold-hi:#F3DCA8; --gold-deep:#A8853F; --card:#1E3828; --card-hi:#25452E;
  --heart:#D9A39A;
}
html,body { height:100%; }
body {
  font-family: Georgia, 'Times New Roman', serif; color:var(--fg);
  background: radial-gradient(1000px 500px at 50% -120px, #2E4A33 0%, transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg2));
  min-height:100%; display:flex; flex-direction:column;
}
header {
  padding: 26px 20px 14px; text-align:center; position:relative;
  border-bottom:1px solid rgba(212,175,98,.38);
}
header h1 { color:var(--gold-hi); font-size:27px; letter-spacing:.08em; text-shadow:0 2px 14px rgba(0,0,0,.7); font-weight:bold; }
#daysRow { margin-top:8px; font-size:15px; color:var(--gold); letter-spacing:.06em; font-style:italic; }
#btnSettings { position:absolute; top:26px; right:16px; background:none; border:none; color:var(--gold); font-size:24px; cursor:pointer; padding:6px; }
nav { display:flex; justify-content:center; gap:10px; padding:14px 12px; }
nav button {
  flex:1; max-width:260px; border:none; cursor:pointer; padding:12px 20px; border-radius:999px;
  font-family:Georgia,serif; font-size:16px; letter-spacing:.07em; color:var(--fg-dim);
  background:rgba(20,39,28,.85); border:1px solid rgba(212,175,98,.25);
}
nav button.active { background:linear-gradient(135deg, var(--gold-hi), var(--gold)); color:#0D1C12; font-weight:bold; border-color:transparent; }
main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
.tab { display:none; } .tab.on { display:block; }
#grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; padding:6px 16px 90px; max-width:1000px; margin:0 auto; }
.card {
  background:linear-gradient(160deg,#EFE5C8, #E2D3AF); border:1px solid var(--gold); border-radius:6px;
  padding:8px 8px 6px; box-shadow:0 8px 22px rgba(0,0,0,.55); cursor:pointer; position:relative;
  transition:transform .12s ease; overflow:hidden;
}
.card:active { transform:scale(.96); }
.card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; border-radius:2px; background:#111; }
.card .cap {
  font-family:Georgia,serif; font-size:11.5px; color:#6B5426; padding:7px 3px 4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.badge {
  position:absolute; top:14px; right:14px; display:flex; align-items:center; gap:4px;
  padding:5px 9px; border-radius:999px; font-size:13px; line-height:1;
  background:rgba(14,22,16,.82); color:var(--gold-hi); border:1px solid rgba(212,175,98,.7);
  box-shadow:0 3px 10px rgba(0,0,0,.5);
}
.badge .n { font-size:12px; color:var(--fg); }
.empty { text-align:center; padding:70px 24px; color:var(--gold); }
.empty .ico { font-size:64px; opacity:.9; }
.empty p { margin-top:14px; font-size:16px; color:var(--fg-dim); font-style:italic; }
.fab {
  position:fixed; right:22px; bottom:22px; width:60px; height:60px; border-radius:50%;
  border:none; cursor:pointer; color:#0D1C12; font-size:32px; line-height:1;
  background:linear-gradient(135deg, var(--gold-hi), var(--gold)); box-shadow:0 8px 22px rgba(0,0,0,.55);
}
#chatView { display:flex; flex-direction:column; height:100%; }
#msgList { flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch; }
.bubble {
  max-width:86%; align-self:flex-start; position:relative;
  background:linear-gradient(160deg, var(--card), var(--card-hi));
  border:1px solid rgba(212,175,98,.35); border-radius:16px 16px 16px 4px;
  padding:11px 46px 10px 14px; box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.bubble .txt { font-size:16px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
.bubble .meta { display:flex; align-items:center; gap:8px; position:absolute; bottom:5px; right:8px; }
.bubble .date { font-size:10.5px; color:var(--gold-deep); font-style:italic; }
.bubble .lk { border:none; background:none; cursor:pointer; font-size:16px; line-height:1; color:var(--gold); padding:2px; }
.bubble .lk .n { font-size:11px; color:var(--fg-dim); margin-right:2px; }
.composer { display:flex; gap:10px; padding:12px 14px 18px; border-top:1px solid rgba(212,175,98,.25); background:rgba(10,20,14,.7); }
.composer input {
  flex:1; border:1px solid rgba(212,175,98,.4); background:#162A1D; color:var(--fg);
  border-radius:999px; padding:13px 18px; font-size:15px; font-family:Georgia,serif; outline:none;
}
.composer button {
  width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; font-size:20px;
  background:linear-gradient(135deg, var(--gold-hi), var(--gold)); color:#0D1C12;
}
#viewer {
  position:fixed; inset:0; background:rgba(5,10,7,.96); display:none; flex-direction:column;
  z-index:50; align-items:center; justify-content:center;
}
#viewer.on { display:flex; }
#viewer img { max-width:94vw; max-height:70vh; border-radius:8px; box-shadow:0 14px 44px rgba(0,0,0,.8); }
#viewerCap { max-width:80vw; margin-top:16px; color:var(--cream-2, #F6EFDF); font-size:16px; font-style:italic; text-align:center; }
#viewerNav { margin-top:18px; display:flex; align-items:center; gap:16px; }
#viewerNav button {
  border:1px solid rgba(212,175,98,.5); background:rgba(22,42,29,.9); color:var(--gold-hi);
  border-radius:999px; padding:9px 20px; font-size:16px; font-family:Georgia,serif; cursor:pointer;
}
#viewerLike { font-size:26px; background:none; border:none; color:var(--heart); cursor:pointer; }
#vwClose { position:absolute; top:18px; right:20px; font-size:30px; color:var(--gold); background:none; border:none; cursor:pointer; }
#vwDel { position:absolute; top:20px; left:20px; font-size:18px; color:var(--gold); background:none; border:none; cursor:pointer; }
#modal {
  position:fixed; inset:0; background:rgba(5,10,7,.78); display:none; align-items:center; justify-content:center; z-index:60; padding:20px;
}
#modal.on { display:flex; }
#modal .box { width:min(420px,94vw); background:linear-gradient(170deg,#21402B,#152B1E); border:1px solid var(--gold); border-radius:18px; padding:22px; box-shadow:0 18px 50px rgba(0,0,0,.7); }
#modal h2 { color:var(--gold-hi); font-size:19px; margin-bottom:12px; letter-spacing:.05em; }
#modal input, #modal textarea {
  width:100%; border:1px solid rgba(212,175,98,.5); background:#162A1D; color:var(--fg);
  border-radius:12px; padding:12px 14px; font-size:15px; font-family:Georgia,serif; outline:none; margin-bottom:14px;
}
#modal .btns { display:flex; gap:10px; justify-content:flex-end; }
#modal .btns button { border:none; cursor:pointer; border-radius:999px; padding:11px 22px; font-size:15px; font-family:Georgia,serif; }
#modal .btns .ok { background:linear-gradient(135deg,var(--gold-hi),var(--gold)); color:#0D1C12; font-weight:bold; }
#modal .btns .no { background:transparent; color:var(--fg-dim); border:1px solid rgba(212,175,98,.35); }
#preview { width:100%; max-height:150px; object-fit:cover; border-radius:10px; margin-bottom:12px; display:none; }
.spark {
  position:fixed; pointer-events:none; z-index:90; color:var(--gold-hi);
  font-size:16px; text-shadow:0 0 8px var(--gold); animation:spark .75s ease-out forwards;
}
@keyframes spark { to { transform:translateY(-70px) scale(.3); opacity:0; } }
#toast {
  position:fixed; left:50%; bottom:30px; transform:translateX(-50%); z-index:99;
  background:rgba(20,39,28,.95); border:1px solid var(--gold); color:var(--gold-hi);
  padding:11px 22px; border-radius:999px; font-size:15px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.6);
}
</style>
</head>
<body>

<header>
  <button id="btnSettings" title="Настройки">⚙</button>
  <h1>Наша Галерея</h1>
  <div id="daysRow"></div>
</header>

<nav>
  <button class="tabbtn active" data-tab="photos">ФОТО</button>
  <button class="tabbtn" data-tab="chat">СООБЩЕНИЯ</button>
</nav>

<main>
  <section id="tabPhotos" class="tab on">
    <div id="grid"></div>
  </section>
  <section id="tabChat" class="tab">
    <div id="chatView">
      <div id="msgList"></div>
      <div class="composer">
        <input id="msgInput" placeholder="Сообщение…" maxlength="500">
        <button id="btnSend">♡</button>
      </div>
    </div>
  </section>
</main>

<button class="fab" id="fab" title="Добавить фото">+</button>

<div id="viewer">
  <button id="vwClose">×</button>
  <button id="vwDel">🗑</button>
  <img id="vwImg" alt="">
  <div id="viewerCap"></div>
  <div id="viewerNav">
    <button id="vwPrev">‹</button>
    <button id="vwLike">♡ <span id="vwLikes">0</span></button>
    <button id="vwNext">›</button>
  </div>
</div>

<div id="modal">
  <div class="box">
    <h2 id="mTitle">Новое фото</h2>
    <img id="preview" alt="">
    <input id="mInput" placeholder="Подпись (необязательно)">
    <div class="btns">
      <button class="no" id="mCancel">Отмена</button>
      <button class="ok" id="mOk">Загрузить</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">

<script>
(function(){
  var BASE = "https://jcqdsjyinaobhigubxkc.supabase.co";
  var KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjcWRzanlpbmFvYmhpZ3VieGtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjkzMDgsImV4cCI6MjEwNTgwNTMwOH0.1KLjxLITFnDDCD5WqROYJNKYcef3ItxNB0NMbYkTwEc";

  var photos = [];
  var msgs = [];
  var caps = {};
  var pLikes = {};
  var mLikes = {};
  var anniv = "";
  var viewerIdx = -1;
  var lastSig = null;
  var timer = null;
  var fileData = null;

  function $(s){ return document.querySelector(s); }

  function head(){
    return { "apikey": KEY, "Authorization": "Bearer " + KEY, "Accept": "application/json" };
  }

  function hPost(url, body){
    var h = head();
    h["Content-Type"] = "application/json";
    return fetch(BASE + url, { method:"POST", headers:h, body: body });
  }
  function hGet(url){
    return fetch(BASE + url, { method:"GET", headers:head() });
  }
  function hDel(url){
    return fetch(BASE + url, { method:"DELETE", headers:head() });
  }

  function toast(t){
    var x = $("#toast"); x.textContent = t; x.style.display = "block";
    clearTimeout(toast._t); toast._t = setTimeout(function(){ x.style.display = "none"; }, 2200);
  }

  function sparks(x, y){
    for (var i = 0; i < 10; i++){
      var s = document.createElement("span");
      s.className = "spark"; s.textContent = "✦";
      s.style.left = (x + (Math.random()*16-8)) + "px";
      s.style.top  = (y + (Math.random()*16-8)) + "px";
      s.style.transform = "translate(0,0)";
      s.style.animationDelay = (Math.random()*0.1) + "s";
      document.body.appendChild(s);
      setTimeout(function(el){ return function(){ if (el && el.parentNode) el.parentNode.removeChild(el); }; }(s), 900);
    }
  }

  function prettyDay(iso){
    if (!iso || iso.length < 10) return "";
    return iso.substring(8,10) + "." + iso.substring(5,7);
  }

  // ---------- Фото ----------

  function photoUrl(name){
    return BASE + "/storage/v1/object/public/gallery/photos/" + encodeURIComponent(name);
  }

  function loadPhotos(force){
    var body = JSON.stringify({ prefix:"photos", limit:200, offset:0, sortBy:{ column:"created_at", order:"desc" } });
    return hPost("/storage/v1/object/list/gallery", body).then(function(r){ return r.json(); }).then(function(arr){
      if (!Array.isArray(arr)) return;
      var names = arr.map(function(o){ return o.name; }).filter(Boolean);
      var sig = names.join("|");
      if (!force && sig === lastSig) return;
      lastSig = sig;
      photos = arr.map(function(o){
        return { name: o.name, url: photoUrl(o.name), date: o.created_at || "" };
      });
      renderGrid();
      loadCaps(names);
    }).catch(function(){});
  }

  function loadCaps(names){
    if (!names.length) return;
    var q = "name=in.(" + names.map(function(n){ return '"' + n.replace(/"/g,'""') + '"'; }).join(",") + ")&select=name,text";
    hGet("/rest/v1/captions?" + q).then(function(r){ return r.json(); }).then(function(arr){
      if (!Array.isArray(arr)) return;
      caps = {};
      arr.forEach(function(o){ caps[o.name] = o.text || ""; });
      renderGrid();
      updateViewerCap();
    }).catch(function(){});
  }

  function renderGrid(){
    var g = $("#grid");
    if (!photos.length) {
      g.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="ico">✦</div><p>Пока пусто. Добавьте первое фото ♡</p></div>';
      return;
    }
    var html = "";
    photos.forEach(function(p){
      var likes = pLikes[p.name] || 0;
      var cap = caps[p.name] || prettyDay(p.date);
      html += '<div class="card" data-idx="' + photos.indexOf(p) + '">'
           +   '<img src="' + p.url + '" loading="lazy" alt="">'
           +   '<div class="cap">' + esc(cap) + '</div>'
           +   '<div class="badge" data-like="' + esc(p.name) + '">♥ <span class="n">' + likes + '</span></div>'
           + '</div>';
    });
    g.innerHTML = html;
    g.querySelectorAll(".card").forEach(function(c){
      c.addEventListener("click", function(e){
        if (e.target.classList.contains("badge")) return;
        openViewer(+c.getAttribute("data-idx"));
      });
    });
    g.querySelectorAll(".badge").forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        var ref = b.getAttribute("data-like");
        postLike("photo", ref, b);
      });
    });
  }

  function esc(s){
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ---------- Лайки ----------

  function postLike(kind, ref, el){
    var body = JSON.stringify({ kind:kind, ref:ref });
    hPost("/rest/v1/likes", body).then(function(){
      if (kind === "photo") pLikes[ref] = (pLikes[ref] || 0) + 1; else mLikes[ref] = (mLikes[ref] || 0) + 1;
      var rect = el.getBoundingClientRect();
      sparks(rect.left + rect.width/2, rect.top + rect.height/2);
      if (kind === "photo") { var card = el.closest(".card"); var n = card && card.querySelector(".badge .n"); if (n) n.textContent = pLikes[ref]; }
      if (viewerIdx >= 0 && kind === "photo") $("#vwLikes").textContent = pLikes[photos[viewerIdx].name] || 0;
      if (kind === "msg") renderMsgs();
    }).catch(function(){
      toast("Не получилось ♡");
    });
  }

  function loadLikes(force){
    return Promise.all([
      hGet("/rest/v1/likes?select=ref&kind=eq.photo").then(function(r){ return r.json(); }),
      hGet("/rest/v1/likes?select=ref&kind=eq.msg").then(function(r){ return r.json(); })
    ]).then(function(rs){
      var pl = {}, ml = {};
      (rs[0] || []).forEach(function(o){ if (o.ref) pl[o.ref] = (pl[o.ref]||0)+1; });
      (rs[1] || []).forEach(function(o){ if (o.ref) ml[o.ref] = (ml[o.ref]||0)+1; });
      var sig = JSON.stringify(pl) + JSON.stringify(ml);
      if (!force && sig === lastLikesSig) return;
      lastLikesSig = sig;
      pLikes = pl; mLikes = ml;
      renderGrid();
      renderMsgs();
      updateViewerLikes();
    }).catch(function(){});
  }
  var lastLikesSig = null;

  // ---------- Сообщения ----------

  function loadMsgs(force, scrollBottom){
    return hGet("/rest/v1/messages?select=*&order=created_at.desc&limit=200").then(function(r){ return r.json(); }).then(function(arr){
      if (!Array.isArray(arr)) return;
      arr = arr.slice().reverse();
      var sig = arr.map(function(m){ return m.text + "|" + (m.created_at||""); }).join("~");
      if (!force && sig === lastMsgSig) return;
      lastMsgSig = sig;
      msgs = arr;
      renderMsgs();
      if (scrollBottom) $("#msgList").scrollTop = 100000;
    }).catch(function(){});
  }
  var lastMsgSig = null;

  function renderMsgs(){
    var list = $("#msgList");
    if (!msgs.length) {
      list.innerHTML = '<div class="empty" style="width:100%"><div class="ico">♡</div><p>Напишите первое сообщение</p></div>';
      return;
    }
    var html = "";
    msgs.forEach(function(m){
      var id = String(m.id);
      var likes = mLikes[id] || 0;
      var date = prettyDay(m.created_at);
      html += '<div class="bubble">'
           +   '<div class="txt">' + esc(m.text).replace(/\n/g,"<br>") + '</div>'
           +   '<div class="meta"><span class="date">' + date + '</span>'
           +   '<button class="lk">♥ <span class="n">' + likes + '</span></button></div>'
           + '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll(".lk").forEach(function(b, i){
      b.addEventListener("click", function(){
        postLike("msg", String(msgs[i].id), b);
      });
    });
  }

  function sendMsg(){
    var inp = $("#msgInput");
    var t = inp.value.trim();
    if (!t) return;
    hPost("/rest/v1/messages", JSON.stringify({ text: t })).then(function(){
      inp.value = "";
      toast("Готово ♡");
      loadMsgs(true, true);
    }).catch(function(){ toast("Не получилось"); });
  }

  // ---------- Просмотр ----------

  function openViewer(idx){
    viewerIdx = idx;
    $("#vwImg").src = photos[idx].url;
    updateViewerCap();
    updateViewerLikes();
    $("#viewer").className = "on";
  }
  function updateViewerCap(){
    if (viewerIdx < 0) return;
    var p = photos[viewerIdx];
    $("#viewerCap").textContent = caps[p.name] || prettyDay(p.date) || "";
  }
  function updateViewerLikes(){
    if (viewerIdx < 0) return;
    $("#vwLikes").textContent = pLikes[photos[viewerIdx].name] || 0;
  }
  function viewerStep(d){
    viewerIdx = (viewerIdx + d + photos.length) % photos.length;
    openViewer(viewerIdx);
  }

  // ---------- Годовщина ----------

  function loadAnniv(force){
    return hGet("/rest/v1/settings?key=eq.anniversary&select=value").then(function(r){ return r.json(); }).then(function(arr){
      var v = (arr && arr.length && arr[0] && arr[0].value) || "";
      if (!force && v === anniv) return;
      anniv = v;
      renderDays();
    }).catch(function(){});
  }
  var lastAnniv = null;

  function renderDays(){
    var el = $("#daysRow");
    if (!anniv) { el.textContent = "нам ♡ N дней"; return; }
    var d = Date.parse(anniv + "T00:00:00Z");
    if (!d) { el.textContent = "нам ♡ N дней"; return; }
    var days = Math.floor((Date.now() - d) / 86400000);
    el.textContent = "нам ♡ " + days + " дней";
  }

  // ---------- Загрузка фото ----------

  function pickFile(){
    $("#fileInput").value = "";
    $("#fileInput").click();
  }

  function resize(file, done){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var w = img.width, h = img.height;
      var max = 1600;
      if (Math.max(w, h) > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      var c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(function(blob){ URL.revokeObjectURL(url); done(blob); }, "image/jpeg", 0.82);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); done(file); };
    img.src = url;
  }

  function uploadPhoto(blob, caption){
    var uid = "";
    for (var i = 0; i < 10; i++) uid += Math.floor(Math.random()*16).toString(16);
    var name = uid + "_" + Date.now().toString(36) + ".jpg";
    var toastSent = function(){ toast("Загружаю…"); };
    toastSent();
    return fetch(BASE + "/storage/v1/object/gallery/photos/" + name, {
      method: "POST",
      headers: { "apikey": KEY, "Authorization": "Bearer " + KEY, "x-upsert": "false" },
      body: blob
    }).then(function(r){
      if (!r.ok) throw new Error("up");
      var p = { name:name, url:photoUrl(name), date:new Date().toISOString() };
      if (caption && caption.trim()) {
        return hPost("/rest/v1/captions?on_conflict=name", JSON.stringify({ name:name, text:caption.trim() }))
          .then(function(){ return p; });
      }
      return p;
    }).then(function(p){
      photos.unshift(p);
      caps[p.name] = caption || "";
      lastSig = null;
      renderGrid();
      toast("Готово ♡");
    }).catch(function(){ toast("Не получилось загрузить"); });
  }

  // ---------- Настройки ----------

  function openSettings(){
    var title = $("#mTitle"); title.textContent = "Наша дата";
    defineModal("Ваша дата (yyyy-MM-dd)", "Сохранить", function(val){
      if (!val) return;
      hPost("/rest/v1/settings?on_conflict=key", JSON.stringify({ key:"anniversary", value:val }))
        .then(function(){ toast("Сохранено ♡"); loadAnniv(true); })
        .catch(function(){ toast("Не получилось"); });
    });
  }

  function defineModal(ph, okText, onOk){
    $("#mInput").value = "";
    $("#mInput").placeholder = ph;
    $("#mInput").style.display = "block";
    $("#preview").style.display = "none";
    $("#mOk").textContent = okText;
    $("#mOk").onclick = function(){
      var v = $("#mInput").value;
      $("#modal").className = "";
      onOk(v);
    };
    $("#mCancel").onclick = function(){ $("#modal").className = ""; };
    $("#modal").className = "on";
    setTimeout(function(){ $("#mInput").focus(); }, 100);
  }

  // ---------- Обновление ----------

  function refreshAll(force){
    return Promise.all([loadPhotos(force), loadMsgs(force), loadLikes(force), loadAnniv(force)])
      .catch(function(){});
  }

  // ---------- События ----------

  $("#btnSettings").addEventListener("click", openSettings);
  $("#fab").addEventListener("click", pickFile);
  $("#fileInput").addEventListener("change", function(){
    var f = this.files[0];
    if (!f) return;
    resize(f, function(blob){
      fileData = { blob: blob };
      var p = $("#preview"); p.src = URL.createObjectURL(blob); p.style.display = "block";
      $("#mTitle").textContent = "Новое фото";
      $("#mInput").placeholder = "Подпись (необязательно)";
      $("#mOk").textContent = "Загрузить";
      $("#mOk").onclick = function(){
        var cap = $("#mInput").value;
        $("#modal").className = "";
        uploadPhoto(fileData.blob, cap);
      };
      $("#mCancel").onclick = function(){ $("#modal").className = ""; };
      $("#modal").className = "on";
      setTimeout(function(){ $("#mInput").focus(); }, 100);
    });
  });

  $("#btnSend").addEventListener("click", sendMsg);
  $("#msgInput").addEventListener("keydown", function(e){ if (e.key === "Enter") sendMsg(); });

  $("#vwClose").addEventListener("click", function(){ $("#viewer").className = ""; viewerIdx = -1; });
  $("#vwPrev").addEventListener("click", function(){ viewerStep(-1); });
  $("#vwNext").addEventListener("click", function(){ viewerStep(1); });
  $("#vwLike").addEventListener("click", function(){
    if (viewerIdx < 0) return;
    var ref = photos[viewerIdx].name;
    postLike("photo", ref, $("#vwLike"));
  });
  $("#vwDel").addEventListener("click", function(){
    if (viewerIdx < 0) return;
    if (!confirm("Удалить это фото?")) return;
    var name = photos[viewerIdx].name;
    hDel("/storage/v1/object/gallery/photos/" + encodeURIComponent(name)).then(function(){
      photos.splice(viewerIdx, 1);
      lastSig = null;
      $("#viewer").className = "";
      viewerIdx = -1;
      renderGrid();
      loadMsgs(true);
      toast("Удалено");
    }).catch(function(){ toast("Не получилось удалить"); });
  });

  document.querySelectorAll(".tabbtn").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".tabbtn").forEach(function(x){ x.className = "tabbtn"; });
      b.className = "tabbtn active";
      var tab = b.getAttribute("data-tab");
      $("#tabPhotos").className = tab === "photos" ? "tab on" : "tab";
      $("#tabChat").className = tab === "chat" ? "tab on" : "tab";
    });
  });

  // ---------- Старт ----------

  refreshAll(true);
  timer = setInterval(function(){ refreshAll(false); }, 6000);
})();
</script>
</body>
</html>
